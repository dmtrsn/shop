name: Baseline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  storefront:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Use setup-go's PATH, rather than an unrelated /usr/local/go install.
      GO: go
      GOFMT: gofmt
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shop_test_admin
          POSTGRES_DB: postgres
          # Disposable CI service only; no deployed or developer credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U shop_test_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go mod download && go mod verify
      - name: Formatting, vet, unit and OpenAPI contract tests, legacy JS syntax
        run: make check
      - name: Go race detector
        run: make test-race
      - name: PostgreSQL migrations, HTTP contract, commerce and concurrency
        env:
          TEST_DATABASE_URL: postgres://shop_test_admin@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?sslmode=disable
        run: make test-integration
      - name: Integration static analysis
        run: go vet -tags=integration ./tests/integration
      - name: Compile production binary
        run: make build
      - name: SMTP delivery through a disposable Mailpit (shopctl email test)
        run: bash scripts/test-email-smtp.sh
      - name: Compose configuration and whitespace
        run: |
          docker compose --env-file .env.example config --quiet
          git diff --check

  edge-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Disposable mail capture: the app sends real SMTP to Mailpit, so
      # self-registration is enabled exactly as with a real provider.
      COMPOSE_PROFILES: mail
      EMAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_TLS: none
      SMTP_FROM: shop@example.com
      PUBLIC_SHOP_ORIGIN: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the production root topology and wait for its health checks
        run: docker compose -p sweetshop-edge-smoke --env-file .env.example up --build --wait --wait-timeout 180 edge mailpit
      - name: Verify public edge route ownership (Next owns /)
        run: EXPECT_ROOT_OWNER=next bash scripts/test-edge-routes.sh
      - name: Authenticated release flow through the edge (disposable data)
        run: node scripts/test-release-flow.mjs
      - name: Self-registration journey with the Mailpit confirmation email (disposable data)
        run: node scripts/test-registration-flow.mjs
      - name: Recreate the edge so the registration limiters start from fresh zones
        run: docker compose -p sweetshop-edge-smoke --env-file .env.example up -d --no-deps --force-recreate --wait --wait-timeout 60 edge
      - name: Registration, resend and confirmation rate limits through the edge (exhausts this runner's buckets)
        run: bash scripts/test-registration-rate-limit.sh
      - name: Recreate the edge so the sign-in limiter starts from a fresh zone
        run: docker compose -p sweetshop-edge-smoke --env-file .env.example up -d --no-deps --force-recreate --wait --wait-timeout 60 edge
      - name: Customer sign-in rate limit through the edge (exhausts this runner's bucket)
        run: bash scripts/test-auth-rate-limit.sh
      - name: Switch only the edge to the legacy-root rollback map
        run: EDGE_ROUTE_MAP=legacy-root docker compose -p sweetshop-edge-smoke --env-file .env.example up -d --no-deps --force-recreate --wait --wait-timeout 60 edge
      - name: Verify rollback route ownership (Go legacy owns /)
        run: EXPECT_ROOT_OWNER=legacy bash scripts/test-edge-routes.sh
      - name: Customer sign-in rate limit on the rollback map (recreated edge, fresh zone)
        run: bash scripts/test-auth-rate-limit.sh
      - name: Staff sign-in limiter in an isolated nginx (no admin host exists yet)
        run: |
          bash scripts/test-staff-auth-limit.sh
          EDGE_TEMPLATE=deploy/nginx/legacy-root.conf.template bash scripts/test-staff-auth-limit.sh
      - name: Show service logs on failure
        if: failure()
        run: docker compose -p sweetshop-edge-smoke --env-file .env.example logs --no-color
      - name: Remove disposable smoke-test services
        if: always()
        run: docker compose -p sweetshop-edge-smoke --env-file .env.example down --volumes --remove-orphans
