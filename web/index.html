<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="description" content="Слой — современный магазин шоколада, печенья, вафель и других кондитерских изделий.">
  <title>Слой — кондитерские изделия</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2218%22 fill=%22%231b2822%22/><path d=%22M16 23h32L32 43z%22 fill=%22%23d8ff72%22/></svg>">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#app-main">К содержимому</a>

  <header class="site-header" id="site-header">
    <div class="utility-bar">
      <div class="shell utility-inner">
        <span>Доставка по Москве сегодня</span>
        <nav aria-label="Сервисная навигация">
          <button class="link-button" data-action="set-city">Москва <svg class="icon"><use href="#i-chevron"></use></svg></button>
          <button class="link-button desktop-only" data-route="delivery">Доставка и оплата</button>
          <a class="desktop-only" href="tel:+74951234567">+7 495 123-45-67</a>
        </nav>
      </div>
    </div>

    <div class="shell header-main">
      <button class="logo" data-route="home" aria-label="Слой, на главную">
        <svg viewBox="0 0 42 42" aria-hidden="true"><rect width="42" height="42" rx="13"/><path d="M10 14.5h22L21 29z"/></svg>
        <span>слой</span>
      </button>

      <button class="catalog-trigger" data-action="toggle-catalog" aria-expanded="false" aria-controls="catalog-mega">
        <svg class="icon"><use href="#i-grid"></use></svg>
        <span>Каталог</span>
      </button>

      <div class="global-search" role="search">
        <svg class="icon search-leading"><use href="#i-search"></use></svg>
        <input id="global-search-input" type="search" autocomplete="off" enterkeyhint="search" placeholder="Товар, бренд или категория" aria-label="Поиск по каталогу" aria-controls="search-panel" aria-expanded="false">
        <kbd class="search-shortcut desktop-only">⌘ K</kbd>
        <button class="search-clear" data-action="clear-search" aria-label="Очистить поиск" hidden><svg class="icon"><use href="#i-close"></use></svg></button>
        <div class="search-panel" id="search-panel" role="listbox" hidden></div>
      </div>

      <nav class="header-actions" aria-label="Личный раздел">
        <button class="header-action" data-route="favorites" aria-label="Избранное">
          <span class="icon-wrap"><svg class="icon"><use href="#i-heart"></use></svg><b class="badge" data-fav-count hidden>0</b></span>
          <span>Избранное</span>
        </button>
        <button class="header-action" data-route="orders" aria-label="Заказы">
          <svg class="icon"><use href="#i-receipt"></use></svg><span>Заказы</span>
        </button>
        <button class="header-action" data-route="profile" aria-label="Профиль">
          <svg class="icon"><use href="#i-user"></use></svg><span>Профиль</span>
        </button>
        <button class="header-action cart-action" data-route="cart" aria-label="Корзина">
          <span class="icon-wrap"><svg class="icon"><use href="#i-bag"></use></svg><b class="badge" data-cart-count hidden>0</b></span>
          <span>Корзина</span>
        </button>
      </nav>
    </div>

    <div class="catalog-mega" id="catalog-mega" hidden>
      <div class="shell mega-layout">
        <button class="mega-mobile-close mobile-only" data-action="close-overlay" aria-label="Закрыть каталог"><svg class="icon"><use href="#i-close"></use></svg></button>
        <div class="mega-categories" id="mega-categories" role="tablist" aria-label="Категории"></div>
        <div class="mega-content" id="mega-content"></div>
        <aside class="mega-promo">
          <span class="eyebrow">Выбор редакции</span>
          <h3>Новый шоколад bean-to-bar</h3>
          <p>12 плиток от малых российских мануфактур.</p>
          <button class="text-link" data-collection="col-new">Смотреть подборку <span>→</span></button>
        </aside>
      </div>
    </div>
  </header>

  <main id="app-main" tabindex="-1"></main>

  <nav class="mobile-nav" aria-label="Основная навигация">
    <button data-route="home"><svg class="icon"><use href="#i-home"></use></svg><span>Главная</span></button>
    <button data-action="toggle-catalog"><svg class="icon"><use href="#i-grid"></use></svg><span>Каталог</span></button>
    <button data-route="favorites"><span class="icon-wrap"><svg class="icon"><use href="#i-heart"></use></svg><b class="badge" data-fav-count hidden>0</b></span><span>Избранное</span></button>
    <button data-route="cart"><span class="icon-wrap"><svg class="icon"><use href="#i-bag"></use></svg><b class="badge" data-cart-count hidden>0</b></span><span>Корзина</span></button>
    <button data-route="profile"><svg class="icon"><use href="#i-user"></use></svg><span>Профиль</span></button>
  </nav>

  <div class="scrim" id="scrim" hidden></div>
  <div class="drawer-root" id="drawer-root" aria-live="polite"></div>
  <div class="modal-root" id="modal-root" aria-live="polite"></div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.75"/><path d="m16 16 4.1 4.1"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7.5 9.5 4.5 4.5 4.5-4.5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 5.9c-1.8-2-5-2.2-7-.3L12 7.3l-1.8-1.7c-2-1.9-5.2-1.7-7 .3-1.7 2-1.5 5 .4 6.8L12 20l8.4-7.3c1.9-1.8 2.1-4.8.4-6.8Z"/></symbol>
    <symbol id="i-heart-fill" viewBox="0 0 24 24"><path d="M20.8 5.9c-1.8-2-5-2.2-7-.3L12 7.3l-1.8-1.7c-2-1.9-5.2-1.7-7 .3-1.7 2-1.5 5 .4 6.8L12 20l8.4-7.3c1.9-1.8 2.1-4.8.4-6.8Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8.5h14l-1 12H6l-1-12Z"/><path d="M9 9V6.8a3 3 0 0 1 6 0V9"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3.5 11 8.5-7 8.5 7v9H15v-6H9v6H3.5v-9Z"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M8 6h12M8 12h8M8 18h4M4 4v16"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 3h6l1 4H8l1-4Zm-2 4 1 14h8l1-14M10 11v6M14 11v6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.2"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="m4 7 8-4 8 4-8 4-8-4Z"/><path d="M4 7v10l8 4 8-4V7M12 11v10"/></symbol>
    <symbol id="i-location" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.2"/></symbol>
    <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  </svg>

  <script src="/app.js" defer></script>
</body>
</html>
