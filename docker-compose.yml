name: sweetshop

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sweetshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sweetshop_local_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sweetshop}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5434}:5434"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    stop_grace_period: 30s
    shm_size: 128mb

  app:
    image: sweetshop:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:-postgres://sweetshop:sweetshop_local_2026@postgres:5432/sweetshop?sslmode=disable}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      WEB_DIR: ${WEB_DIR:-/app/web}
      MIGRATIONS_DIR: ${MIGRATIONS_DIR:-/app/migrations}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-16}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

volumes:
  postgres_data:
