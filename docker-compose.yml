name: sweetshop

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sweetshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sweetshop}
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    stop_grace_period: 30s
    shm_size: 128mb

  app:
    image: sweetshop:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: :8080
      APP_MODE: ${APP_MODE:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      WEB_DIR: ${WEB_DIR:-/app/web}
      MIGRATIONS_DIR: ${MIGRATIONS_DIR:-/app/migrations}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-16}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

  storefront:
    image: sweetshop-storefront:local
    # Root artifact: Next is built without a basePath and owns / at the edge.
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: ${STOREFRONT_PORT:-3000}
      # Private server-to-server target; it is never exposed as NEXT_PUBLIC_*.
      STOREFRONT_API_BASE_URL: ${STOREFRONT_API_BASE_URL:-http://app:8080}
    expose:
      - "${STOREFRONT_PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.PORT + '/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
      storefront:
        condition: service_healthy
    environment:
      STOREFRONT_PORT: ${STOREFRONT_PORT:-3000}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      # Route map: default (Next owns /) or legacy-root (rollback: Go owns /).
      # Without create_host_path an unknown value fails startup instead of
      # mounting an empty directory.
      - type: bind
        source: ./deploy/nginx/${EDGE_ROUTE_MAP:-default}.conf.template
        target: /etc/nginx/templates/default.conf.template
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/edge/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s

volumes:
  postgres_data:
