        No collection or series suggestions. PostgreSQL uses catalog popularity order for product suggestions;
        memory uses fixture order.'
      security: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              description: Echoed X-Request-ID or server-generated identifier.
              schema:
