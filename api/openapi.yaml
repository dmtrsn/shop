openapi: 3.0.3
info:
  title: Sweetshop current HTTP API
  version: 1.0.0-baseline
  description: Implemented /api contract, baseline 2026-09-25. PostgreSQL behavior is authoritative; noted memory
    differences are preserved. No future v2 routes. JSON-decoded endpoints require one JSON value, reject unknown
    fields, and cap body at 1048576 bytes; malformed/empty/oversize bodies return 422, not 400/413. Content-Type
    is not enforced. Go accepts case-insensitive JSON member names and null as zero/unset values; schemas describe
    canonical spellings and usable requests. No independent batch item-count limit. HTTP server MaxHeaderBytes=1048576,
    ReadHeaderTimeout=5s, ReadTimeout=15s, WriteTimeout=30s. Every GET also accepts HEAD through Go ServeMux (network
    HEAD has no response body). Protected responses and login use no-store. Unmatched /api routes/methods reach
    the static fallback and return 404 in the deployed configuration; no standardized 405 envelope. Generic error
    mapper also supports forbidden=403, though no current use case emits it. Public collections/entity lists and
    order history have no pagination. No promise of JavaScript-safe bounds for int64 money.
servers:
- url: /
paths:
  /api/health:
    get:
      operationId: health
      summary: health
      description: 'Readiness: PostgreSQL Ping with a 2-second timeout; explicit memory mode reports ready without
        persistence. No separate liveness endpoint.'
      security: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              description: Echoed X-Request-ID or server-generated identifier.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          description: internal_error; unexpected storage or server failure.
          headers:
            X-Request-ID:
              description: Echoed X-Request-ID or server-generated identifier.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Repository ping failed; status=unavailable, not the standard error envelope.
          headers:
            X-Request-ID:
              description: Echoed X-Request-ID or server-generated identifier.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/auth/login:
    post:
      operationId: login
      summary: login
      description: Lowercases and trims email; password is not trimmed. Returns random bearer token and 30-day expiry;
        only SHA-256 token hash is stored. No logout/revocation endpoint. Missing/empty credentials return 422;
        wrong or unknown credentials return 401.
      security: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              description: Echoed X-Request-ID or server-generated identifier.
              schema:
                type: string
