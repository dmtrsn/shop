        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        parentId:
          type: string
        icon:
          type: string
        productCount:
          type: integer
          format: int32
      required:
      - id
      - slug
      - name
      - productCount
      additionalProperties: false
    Manufacturer:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        country:
          type: string
        description:
          type: string
        logo:
          type: string
        productCount:
          type: integer
          format: int32
      required:
      - id
      - slug
      - name
      - country
      - productCount
      additionalProperties: false
    Brand:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        manufacturerId:
          type: string
        manufacturer:
          type: string
        description:
          type: string
        logo:
          type: string
        productCount:
          type: integer
          format: int32
      required:
      - id
      - slug
      - name
      - manufacturerId
      - manufacturer
      - productCount
      additionalProperties: false
    Product:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        sku:
          type: string
        name:
          type: string
        shortName:
          type: string
        description:
          type: string
        priceMinor:
          type: integer
          format: int64
        oldPriceMinor:
          type: integer
          format: int64
        currency:
          type: string
        unit:
          type: string
        weightGrams:
          type: integer
          format: int32
        image:
          type: string
        gallery:
          type: array
          items:
            type: string
        category:
          $ref: '#/components/schemas/Category'
        manufacturer:
          $ref: '#/components/schemas/Manufacturer'
        brand:
          $ref: '#/components/schemas/Brand'
        series:
          type: string
        tags:
          type: array
          items:
            type: string
        badges:
          type: array
          items:
            type: string
        ingredients:
          type: string
        nutrition:
          type: string
        shelfLifeDays:
          type: integer
          format: int32
        rating:
          type: number
          format: double
        reviewsCount:
          type: integer
          format: int32
        stock:
          type: integer
          format: int32
        minimumQuantity:
          type: integer
          format: int32
        quantityStep:
          type: integer
          format: int32
        featured:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - slug
      - sku
      - name
      - description
      - priceMinor
      - currency
      - unit
      - image
      - category
      - manufacturer
      - brand
      - rating
      - reviewsCount
      - stock
      - minimumQuantity
      - quantityStep
      - createdAt
      additionalProperties: false
      description: Prices are integer currency minor units (seed currency RUB). Optional zero/empty fields are omitted.
        Nested entity productCount is normally zero, not the directory count. A discontinued repeat item uses this
        same shape with historical id/SKU/name/image and zero-value remaining fields, including empty nested entities,
        zero quantity rules and a year-0001 createdAt.
    Collection:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        accent:
          type: string
        image:
          type: string
        productIds:
          type: array
          items:
            type: string
          nullable: true
        productCount:
          type: integer
          format: int32
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      required:
      - id
      - slug
      - name
      - description
      - accent
      - productIds
      - productCount
      - startsAt
      - endsAt
      additionalProperties: false
      description: Directory listing and direct catalog filtering respect the same inclusive start/end schedule.
        Unset timestamps serialize as 0001-01-01T00:00:00Z despite omitempty. Catalog filtering does not preserve
        editorial sort order.
    ProductPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
      required:
      - items
      - total
      - page
      - limit
      - totalPages
      additionalProperties: false
    FacetValue:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        count:
          type: integer
          format: int32
      required:
      - id
      - slug
      - name
      - count
      additionalProperties: false
    CatalogFacets:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/FacetValue'
        manufacturers:
          type: array
          items:
            $ref: '#/components/schemas/FacetValue'
        brands:
          type: array
          items:
            $ref: '#/components/schemas/FacetValue'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/FacetValue'
        series:
          type: array
          items:
            $ref: '#/components/schemas/FacetValue'
        minPriceMinor:
          type: integer
          format: int64
        maxPriceMinor:
          type: integer
          format: int64
      required:
      - categories
      - manufacturers
      - brands
      - tags
      - series
      - minPriceMinor
      - maxPriceMinor
      additionalProperties: false
      description: All current filters apply to every aggregation, including the axis itself. Counts reflect directly
        assigned product categories, not ancestor counts. Facet arrays are empty on no matches; price bounds are
        then zero. Results are unpaginated. sort/page/limit are parsed but ignored (service catalog bounds and sort
        allowlist are not applied here).
    SearchSuggestion:
      type: object
      properties:
        type:
          type: string
          enum:
          - product
          - manufacturer
          - brand
          - category
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        subtitle:
          type: string
        image:
          type: string
      required:
      - type
      - id
      - slug
      - title
      additionalProperties: false
    CartItem:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer
          format: int32
        selected:
          type: boolean
        available:
          type: integer
          format: int32
        lineTotalMinor:
          type: integer
          format: int64
        issue:
          type: string
      required:
      - product
      - quantity
      - selected
      - available
      - lineTotalMinor
      additionalProperties: false
    CartGroup:
      type: object
      properties:
        manufacturer:
          $ref: '#/components/schemas/Manufacturer'
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        selectedCount:
          type: integer
          format: int32
        subtotalMinor:
          type: integer
          format: int64
      required:
      - manufacturer
      - items
      - selectedCount
      - subtotalMinor
      additionalProperties: false
      description: selectedCount counts units including unavailable selections. subtotalMinor uses current prices
        for eligible selected lines (unlike summary subtotal, which uses list prices).
    CartSummary:
      type: object
      properties:
        itemCount:
          type: integer
          format: int32
        positionCount:
          type: integer
          format: int32
        selectedCount:
          type: integer
          format: int32
        subtotalMinor:
          type: integer
          format: int64
        discountMinor:
          type: integer
          format: int64
        deliveryMinor:
          type: integer
          format: int64
        totalMinor:
          type: integer
          format: int64
        unavailableCount:
          type: integer
          format: int32
      required:
      - itemCount
      - positionCount
      - selectedCount
      - subtotalMinor
      - discountMinor
      - deliveryMinor
      - totalMinor
      - unavailableCount
      additionalProperties: false
      description: itemCount and selectedCount count units (selectedCount includes selected unavailable lines).
        positionCount and unavailableCount count lines. Subtotal uses max(priceMinor,oldPriceMinor) on selected
        lines without stock issues; discount is the difference from current prices. Delivery is 29000 when net subtotal
        is positive and below 350000, otherwise zero. Total = subtotal - discount + delivery. Quantity-rule changes
        are not represented as cart issues.
    Cart:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/CartGroup'
        summary:
          $ref: '#/components/schemas/CartSummary'
        updatedAt:
          type: string
          format: date-time
      required:
      - items
      - groups
      - summary
      - updatedAt
      additionalProperties: false
      description: items and groups are arrays, including when empty. Each group repeats its complete items. updatedAt
        is the maximum surviving row timestamp, or year 0001 for empty carts; it is not a monotonic revision. Product
        data is current, not a reserved offer.
    FavoriteGroup:
      type: object
      properties:
        manufacturer:
          $ref: '#/components/schemas/Manufacturer'
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
      required:
      - manufacturer
      - products
      additionalProperties: false
    Favorites:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/FavoriteGroup'
        total:
          type: integer
          format: int32
      required:
      - items
      - groups
      - total
      additionalProperties: false
    OrderItem:
      type: object
      properties:
        productId:
          type: string
        sku:
          type: string
        name:
          type: string
        image:
          type: string
        manufacturerId:
          type: string
        manufacturer:
          type: string
        quantity:
          type: integer
          format: int32
        unitPriceMinor:
          type: integer
          format: int64
        lineTotalMinor:
          type: integer
          format: int64
      required:
      - productId
      - sku
      - name
      - image
      - manufacturerId
      - manufacturer
      - quantity
      - unitPriceMinor
      - lineTotalMinor
      additionalProperties: false
    Order:
      type: object
      properties:
        id:
          type: string
        number:
          type: string
        status:
          type: string
        statusLabel:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          nullable: true
        itemCount:
          type: integer
          format: int32
        totalMinor:
          type: integer
          format: int64
        deliveryAddress:
          type: string
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
      required:
      - id
      - number
      - status
      - statusLabel
      - items
      - itemCount
      - totalMinor
      - deliveryAddress
      - createdAt
      - deliveredAt
      additionalProperties: false
      description: Items preserve productId, SKU, name, image, manufacturer identity/name, quantity and prices independently
        of the live product. No currency or delivery breakdown is stored on the order. Total includes delivery for
        new checkouts. deliveredAt always serializes, with year 0001 when unset. A database order with no item rows
        has items=[] in detail and items=null in PostgreSQL history. History is unpaginated.
    RepeatItem:
      type: object
      properties:
        product:
          $ref: '#/components/schemas/Product'
        requestedQuantity:
          type: integer
          format: int32
        availableQuantity:
          type: integer
          format: int32
        addableQuantity:
          type: integer
          format: int32
        suggestedQuantity:
          type: integer
          format: int32
        proposedQuantity:
          type: integer
          format: int32
        alreadyInCartQuantity:
          type: integer
          format: int32
        originalUnitPriceMinor:
          type: integer
          format: int64
        currentUnitPriceMinor:
          type: integer
          format: int64
        priceDeltaMinor:
          type: integer
          format: int64
        priceChanged:
          type: boolean
        selected:
          type: boolean
        status:
          type: string
          enum:
          - available
          - limited
          - unavailable
          - discontinued
        message:
          type: string
        replacement:
          $ref: '#/components/schemas/Product'
      required:
      - product
      - requestedQuantity
      - availableQuantity
      - addableQuantity
      - suggestedQuantity
      - proposedQuantity
      - alreadyInCartQuantity
      - originalUnitPriceMinor
      - currentUnitPriceMinor
      - priceDeltaMinor
      - priceChanged
      - selected
      - status
      additionalProperties: false
      description: Quantities are proposed additions. availableQuantity is total stock; addableQuantity=max(stock-alreadyInCartQuantity,0).
        Final cart quantity must be >= minimumQuantity and (final-minimumQuantity) divisible by quantityStep. Suggested
        quantity rounds DOWN within original request/available stock. If only an addition above the request can
        satisfy minimum, proposedQuantity holds the smallest addition, suggestedQuantity=0, selected=false, status=limited.
        Replacement is informational; arbitrary replacement IDs cannot be committed.
    RepeatPreview:
      type: object
      properties:
        orderId:
          type: string
        orderNumber:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/RepeatItem'
        requestedCount:
          type: integer
          format: int32
        availableCount:
          type: integer
          format: int32
        limitedCount:
          type: integer
          format: int32
        unavailableCount:
          type: integer
          format: int32
        estimatedTotalMinor:
          type: integer
          format: int64
      required:
      - orderId
      - orderNumber
      - items
      - requestedCount
      - availableCount
      - limitedCount
      - unavailableCount
      - estimatedTotalMinor
      additionalProperties: false
      description: requestedCount counts historical units; availableCount, limitedCount and unavailableCount count
        lines. Estimated total uses selected suggested additions at current prices, excluding delivery. Preview
        performs no cart writes and creates no review token.
    RepeatCommitResult:
      type: object
      properties:
        cart:
          $ref: '#/components/schemas/Cart'
        addedCount:
          type: integer
          format: int32
        addedQuantity:
          type: integer
          format: int32
        adjustedCount:
          type: integer
          format: int32
        skippedCount:
          type: integer
          format: int32
      required:
      - cart
      - addedCount
      - addedQuantity
      - adjustedCount
      - skippedCount
      additionalProperties: false
      description: addedCount counts added lines; addedQuantity counts added units. adjustedCount counts additions
        different from historical requested quantity. skippedCount counts explicitly deselected lines, or skipped
        preview defaults for empty input; omitted lines in an explicit nonempty input are not counted.
    Error:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
              - validation_error
              - unauthorized
              - forbidden
              - not_found
              - out_of_stock
              - conflict
              - internal_error
            message:
              type: string
            requestId:
              type: string
            fields:
              type: array
              items:
                type: object
                required:
                - field
                - message
                properties:
                  field:
                    type: string
                  message:
                    type: string
                additionalProperties: false
    LoginResult:
      type: object
      required:
      - token
      - expiresAt
      - user
      additionalProperties: false
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    Health:
      type: object
      required:
