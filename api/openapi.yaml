components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Case-insensitive Bearer scheme; exactly two whitespace-delimited header parts. Opaque token from
        login, 30 days; no cookie authentication.
  parameters:
    q:
      name: q
      in: query
      required: false
      description: Trimmed query; catalog, facets and suggestions reject more than 200 Unicode code points.
        PostgreSQL full text (simple) OR substring search; % and _ retain LIKE wildcard meaning.
      schema:
        type: string
    category:
      name: category
      in: query
      required: false
      description: Exact ID or slug. Category includes itself and direct children only.
      schema:
        type: string
    manufacturer:
      name: manufacturer
      in: query
      required: false
      description: Exact ID or slug. Trimmed.
      schema:
        type: string
    brand:
      name: brand
      in: query
      required: false
      description: Exact ID or slug. Trimmed.
      schema:
        type: string
    collection:
      name: collection
      in: query
      required: false
      description: Exact ID or slug. Collection input is not trimmed. A collection outside its inclusive start/end
        schedule matches no products.
      schema:
        type: string
    series:
      name: series
      in: query
      required: false
      description: Case-insensitive exact series text, trimmed.
      schema:
        type: string
    tag:
      name: tag
      in: query
      required: false
      description: Repeat parameter; all supplied tags must match. PostgreSQL tag matching is case-sensitive.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    tags:
      name: tags
      in: query
      required: false
      description: Comma-separated tags; trims and discards empty elements, combines with repeated tag values.
      schema:
        type: string
    minPriceMinor:
      name: minPriceMinor
      in: query
      required: false
      description: Nonnegative int64 MINOR units, including the legacy alias. Canonical nonempty parameter wins.
        Zero means no bound; min/max ordering is not validated.
      schema:
        type: integer
        format: int64
        minimum: 0
    maxPriceMinor:
      name: maxPriceMinor
      in: query
      required: false
      description: Nonnegative int64 MINOR units, including the legacy alias. Canonical nonempty parameter wins.
        Zero means no bound; min/max ordering is not validated.
      schema:
        type: integer
        format: int64
        minimum: 0
    minPrice:
      name: minPrice
      in: query
      required: false
      description: Nonnegative int64 MINOR units, including the legacy alias. Canonical nonempty parameter wins.
        Zero means no bound; min/max ordering is not validated.
      schema:
        type: integer
        format: int64
        minimum: 0
    maxPrice:
      name: maxPrice
      in: query
      required: false
      description: Nonnegative int64 MINOR units, including the legacy alias. Canonical nonempty parameter wins.
        Zero means no bound; min/max ordering is not validated.
      schema:
        type: integer
        format: int64
        minimum: 0
    inStock:
      name: inStock
      in: query
      required: false
      description: 'Accepted Go boolean strings: 1,t,T,TRUE,true,True,0,f,F,FALSE,false,False. Empty means unset;
        invalid values return 422. false selects zero stock.'
      schema:
        type: string
        enum:
        - ''
        - '1'
        - t
        - T
        - 'TRUE'
        - 'true'
        - 'True'
        - '0'
        - f
        - F
        - 'FALSE'
        - 'false'
        - 'False'
    sale:
      name: sale
      in: query
      required: false
      description: 'Accepted Go boolean strings: 1,t,T,TRUE,true,True,0,f,F,FALSE,false,False. Empty means unset;
        invalid values return 422. true requires oldPriceMinor > priceMinor.'
      schema:
        type: string
        enum:
        - ''
        - '1'
        - t
        - T
        - 'TRUE'
        - 'true'
        - 'True'
        - '0'
        - f
        - F
        - 'FALSE'
        - 'false'
        - 'False'
    newOnly:
      name: newOnly
      in: query
      required: false
      description: 'Accepted Go boolean strings: 1,t,T,TRUE,true,True,0,f,F,FALSE,false,False. Empty means unset;
        invalid values return 422. false does not filter. newOnly takes precedence over new; matches Новинка badge.'
      schema:
        type: string
        enum:
        - ''
        - '1'
        - t
        - T
        - 'TRUE'
        - 'true'
        - 'True'
        - '0'
        - f
        - F
        - 'FALSE'
        - 'false'
        - 'False'
    new:
      name: new
      in: query
      required: false
      description: 'Accepted Go boolean strings: 1,t,T,TRUE,true,True,0,f,F,FALSE,false,False. Empty means unset;
        invalid values return 422. false does not filter. newOnly takes precedence over new; matches Новинка badge.'
      schema:
        type: string
        enum:
        - ''
        - '1'
        - t
        - T
        - 'TRUE'
        - 'true'
        - 'True'
        - '0'
        - f
        - F
        - 'FALSE'
        - 'false'
        - 'False'
    sort:
      name: sort
      in: query
      required: false
      description: Catalog accepts empty/popular,new,price_asc,price_desc,rating,name. priceAsc/priceDesc are frontend
        names, NOT HTTP aliases. Facets ignores sort. Ties have no stable ID guarantee.
      schema:
        type: string
    page:
      name: page
      in: query
      required: false
      description: Integer; catalog values below 1 become 1, above 1000000 return 422. Facets ignores after integer
        parsing.
      schema:
        type: integer
        format: int32
    limit:
      name: limit
      in: query
      required: false
      description: Integer; limit wins over size when nonempty. Catalog values below 1 become 24, above 100 become
        100. Facets ignores after integer parsing.
      schema:
        type: integer
        format: int32
    size:
      name: size
      in: query
      required: false
      description: Integer; limit wins over size when nonempty. Catalog values below 1 become 24, above 100 become
        100. Facets ignores after integer parsing.
      schema:
        type: integer
        format: int32
    selectedOnly:
      name: selectedOnly
      in: query
      required: false
      description: True deletes selected lines; missing, empty, FALSE and even malformed values mean false and DELETE
        ALL cart lines. This legacy behavior is preserved.
      schema:
        type: string
    product:
      name: product
      in: path
      required: true
      description: Product ID, slug, or case-insensitive SKU unless an operation states otherwise.
      schema:
        type: string
    order:
      name: order
      in: path
      required: true
      description: 'Owned order ID or order number. Encode # in numbers as %23. Foreign or missing orders return
        404.'
      schema:
        type: string
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
      - id
