      operationId: setCartItem
      summary: setCartItem
      description: Absolute quantity assignment, not increment. selected defaults true when omitted/null. Resolves
        product ID/slug/SKU. Quantity must be positive, <= stock, >= minimum and (quantity-minimum)%step=0. Stock
