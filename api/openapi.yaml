  /api/catalog:
    get:
      operationId: catalog
      summary: catalog
      description: All filter axes combine with AND. Defaults page=1, limit=24, sort=popular. No matches return
        items=[], total=0, totalPages=0. Beyond last page returns empty items with requested page. Count and items
        are separate queries and not a consistent snapshot under concurrent writes. PostgreSQL ends every sort with
        product id ascending as a unique tie-breaker; memory keeps stable fixture order for ties.
      security: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              description: Echoed X-Request-ID or server-generated identifier.
