        '422':
          description: validation_error; optional error.fields identifies invalid input.
          headers:
            X-Request-ID:
              description: Echoed X-Request-ID or server-generated identifier.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: unauthorized; incorrect credentials.
          headers:
            X-Request-ID:
              description: Echoed X-Request-ID or server-generated identifier.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
