      - storage
      - time
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ok
          - unavailable
        storage:
          type: string
          enum:
          - memory
          - postgres
        time:
          type: string
          format: date-time
    Me:
      type: object
      required:
      - user
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
    Categories:
      type: object
      required:
