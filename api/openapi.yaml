      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    Manufacturers:
      type: object
      required:
      - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Manufacturer'
    Brands:
      type: object
      required:
      - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Brand'
    Collections:
      type: object
      required:
      - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
    Suggestions:
      type: object
      required:
      - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchSuggestion'
    Orders:
      type: object
      required:
      - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
    LoginInput:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          format: password
      required:
      - email
      - password
      additionalProperties: false
    CartSetInput:
      type: object
      properties:
