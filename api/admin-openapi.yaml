  /api/admin/v1/media:
    get:
      operationId: listMedia
      summary: listMedia
      description: >-
        Live managed media assets, newest first (deleted assets are never listed). page starts at 1 (at most
        10000); limit is 1-100, default 50. Each item carries productCount, the number of products that
        reference it. Requires the staff session.
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/StaffChanged'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: uploadMedia
      summary: uploadMedia
      description: >-
        Uploads one product image as multipart/form-data with exactly one part named "file" (ADR 019). The
        part's file name and declared type are ignored: the bytes must be a still JPEG, PNG or WebP image (no
        SVG, GIF or animation) of at most 10485760 bytes, at most 8192 pixels per side and 16777216 pixels in
        total. The image is decoded and re-encoded (JPEG when opaque, PNG when it has transparency), which
        drops EXIF and any other metadata; a JPEG's EXIF orientation is applied to the pixels. Content type,
        size, dimensions and SHA-256 describe the stored bytes, which never change: the asset ID is new for
        every upload and never reused. The stored file is written before its metadata and audit event
        (media.upload) commit together; a failed commit removes it again. Errors: 413 media_too_large, 415
        unsupported_media_type, 422 validation_error (field file: corrupt, truncated or too many pixels; or a
        malformed multipart body), 503 storage_unavailable.
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      - $ref: '#/components/parameters/ExpectedStaffID'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaUpload'
      responses:
        '201':
          description: Uploaded
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '409':
          $ref: '#/components/responses/StaffChanged'
        '413':
          $ref: '#/components/responses/MediaTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMedia'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/admin/v1/products/{product}/media:
    parameters:
    - $ref: '#/components/parameters/Product'
    put:
      operationId: setProductMedia
      summary: Replace managed primary and ordered gallery
      description: >-
        Requires a staff session, trusted Origin, CSRF and the expected staff identity.
        Atomically checks expectedRevision, validates live assets, replaces every managed reference,
        increments the product revision once and emits one product.media_update audit event.
        Archived products may be edited. Legacy image/gallery columns are untouched.
        primaryId may be null; galleryIds must be unique, at most 20, and exclude primaryId.
        Stale revisions return 409 stale_revision without any writes or audit event.
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      - $ref: '#/components/parameters/ExpectedStaffID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, primaryId, galleryIds]
              properties:
                expectedRevision:
                  type: integer
                  format: int64
                  minimum: 1
                primaryId:
                  type: string
                  nullable: true
                  pattern: '^med_[0-9a-f]{32}$'
                galleryIds:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items:
                    type: string
                    pattern: '^med_[0-9a-f]{32}$'
      responses:
        '200':
          description: Exact committed state and revision
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revision, productId, galleryIds]
                properties:
                  revision:
                    type: integer
                    format: int64
                    minimum: 2
                  productId:
                    type: string
                  primaryId:
                    type: string
                  galleryIds:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
