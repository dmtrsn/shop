            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/StaffChanged'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteMedia
      summary: deleteMedia
      description: >-
        Deletes an unreferenced asset: the row is tombstoned (its ID is never reused) together with the audit
        event media.delete, /media/{id} answers 404 from then on, and the file is removed after the commit. If
        that removal fails the deletion still stands and `shopctl media verify --apply` removes the leftover
        later. An asset referenced by products or historical order snapshots is 409 reference_conflict with safe counts error.references.products and error.references.orders, and
        nothing changes; detach it first. Copies already held by browsers or proxies are not purged. There is no
        request body and no replacement of an asset's bytes.
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      - $ref: '#/components/parameters/ExpectedStaffID'
      responses:
        '204':
          description: Deleted
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          $ref: '#/components/responses/MediaNotFound'
        '409':
          $ref: '#/components/responses/MediaConflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/v1/orders:
    get:
      operationId: listOrders
      summary: listOrders
      description: >-
        Staff order list, newest first (then by ID). status filters one status (processing, transit,
        delivered or cancelled); omitted means all. q (up to 100 characters, one line) matches the order ID or
        number exactly ("10483" and "#10483" both match #10483) or a case-insensitive substring of the
        order-time contact's or the current account's email or name. page starts at 1 (at most 10000); limit is 1-100, default 50. List items carry
        no lines.
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OrderStatus'
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10000
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/StaffChanged'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/v1/orders/{order}:
    parameters:
    - $ref: '#/components/parameters/Order'
    get:
      operationId: getOrder
      summary: getOrder
      description: >-
        One order with its lines. Lines, prices, totals, delivery address, comment and contact are what checkout
        stored at the time of the order and never change, whatever later happens to the account. An order without
        contact predates its recording; it carries currentAccount instead, explicitly the account as it is now.
        allowedTransitions lists the statuses staff may move the order to; empty means no further change.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaffChanged'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/v1/orders/{order}/status:
    parameters:
    - $ref: '#/components/parameters/Order'
    post:
      operationId: changeOrderStatus
      summary: changeOrderStatus
      description: >-
        Moves an order forward: processing to transit, or transit to delivered (which also sets deliveredAt).
        status must be transit or delivered (422 otherwise; cancellation is cancelOrder). expectedRevision must be
        the current revision (409 stale_revision); a transition the current status does not allow is 409
        invalid_transition. Success increments the revision by one. Audited as order.status_change. No customer
        notification is sent.
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      - $ref: '#/components/parameters/ExpectedStaffID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusChangeInput'
      responses:
        '200':
          description: Changed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrderConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/v1/orders/{order}/cancel:
    parameters:
    - $ref: '#/components/parameters/Order'
    post:
      operationId: cancelOrder
      summary: cancelOrder
      description: >-
        Cancels an order that is still processing and, in the same transaction, returns every ordered quantity
        to its product's stock (archived products included; they stay archived; a product row that no longer
        exists gets nothing back). Each restocked product gets a new revision. An order reaches cancelled only
        from processing, so its stock returns at most once; cancelling again is 409 invalid_transition, a stale
        expectedRevision is 409 stale_revision. Audited as order.cancel. Nothing is refunded and no customer
        notification is sent.
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      - $ref: '#/components/parameters/ExpectedStaffID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionInput'
      responses:
        '200':
          description: Cancelled
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrderConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  headers:
    RequestID:
      description: Echoed X-Request-ID or server-generated identifier.
      schema:
        type: string
    NoStore:
      schema:
        type: string
        enum:
        - no-store
  parameters:
    Product:
      name: product
      in: path
      required: true
      description: Product ID (legacy IDs such as p01, or prd_ + 32 hex digits).
      schema:
        type: string
    Order:
      name: order
      in: path
      required: true
      description: Order ID (for example ord-2026-10483).
      schema:
        type: string
    Category:
      name: category
      in: path
      required: true
      description: Category ID (seeded IDs such as cat-bars, or cat_ + 32 hex digits).
      schema:
        type: string
    Manufacturer:
      name: manufacturer
      in: path
      required: true
      description: Manufacturer ID (seeded IDs such as m-choco, or mfr_ + 32 hex digits).
      schema:
        type: string
    Brand:
      name: brand
      in: path
      required: true
      description: Brand ID (seeded IDs such as b-atelier-noir, or brd_ + 32 hex digits).
      schema:
        type: string
    Collection:
      name: collection
      in: path
      required: true
      description: Collection ID (seeded IDs such as col-gifts, or col_ + 32 hex digits).
      schema:
        type: string
    DictionaryStatus:
      name: status
      in: query
      required: false
      description: active (default), archived or all.
      schema:
        type: string
        enum:
        - active
        - archived
        - all
    Media:
      name: media
      in: path
      required: true
      description: Media ID, med_ + 32 hex digits.
      schema:
        type: string
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: The staff CSRF token from the staff session.
      schema:
        type: string
    ExpectedStaffID:
      name: X-Expected-Staff-ID
      in: header
      required: false
      schema:
        type: string
  responses:
    Unauthorized:
      description: unauthorized; bad credentials, disabled account, invalid session or an Authorization header.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CSRFFailed:
      description: csrf_failed; missing or non-staff Origin, or a missing/invalid staff CSRF token.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: validation_error; optional error.fields identifies invalid input.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: not_found; no product has this ID.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StaffChanged:
      description: authenticated_staff_changed; X-Expected-Staff-ID names a different staff member.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RevisionConflict:
      description: >-
        stale_revision (expectedRevision is not the current revision; reload and reapply); conflict (archive of
        an archived product or restore of an active one); authenticated_staff_changed. Nothing changed and no
        audit event was written.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrderConflict:
      description: >-
        stale_revision (expectedRevision is not the current revision; reload); invalid_transition (the current
        status does not allow this change, for example a delivered or already cancelled order);
        authenticated_staff_changed. Nothing changed and no audit event was written.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DictionaryNotFound:
      description: not_found; no row of this dictionary has this ID.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DictionaryValidationError:
      description: >-
        validation_error (error.fields identifies invalid input, including a missing or archived reference and
        a used slug); invalid_hierarchy (a category tree change that would not stay two levels deep). Nothing
        changed and no audit event was written.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DictionaryConflict:
      description: >-
        stale_revision (expectedRevision is not the current revision; reload and reapply); conflict (archive of
        an archived row or restore of an active one); reference_conflict (the row is still used; error.references
        carries the counts); authenticated_staff_changed. Nothing changed and no audit event was written.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MediaNotFound:
      description: not_found; no live media asset has this ID.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MediaTooLarge:
      description: media_too_large; the request or the file exceeds the upload limit. Nothing was stored.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMedia:
      description: unsupported_media_type; the bytes are not a still JPEG, PNG or WebP image. Nothing was stored.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StorageUnavailable:
      description: storage_unavailable; the media store failed. Nothing was registered; retry later (Retry-After).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MediaConflict:
      description: >-
        reference_conflict (products reference the asset; error.references.products counts them);
        authenticated_staff_changed. Nothing changed and no audit event was written.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: internal_error; unexpected storage or server failure.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ProductMediaItem:
      type: object
      additionalProperties: false
      required: [id, url, width, height, contentType, position]
      properties:
        id:
          type: string
          pattern: '^med_[0-9a-f]{32}$'
        url:
          type: string
          pattern: '^/media/med_[0-9a-f]{32}$'
        thumbnailUrl:
          type: string
          pattern: '^/media/med_[0-9a-f]{32}/thumbnail/[0-9a-f]{64}$'
