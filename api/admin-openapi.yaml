openapi: 3.0.3
info:
  title: Sweetshop staff (admin) HTTP API
  version: 0.4.0-b4
  description: >-
    Staff API under /api/admin/v1, separate from the customer contract in openapi.yaml. Staff are a separate
    principal: staff_users/staff_sessions, the HttpOnly SameSite=Strict cookie __Host-sweetshop_staff
    (sweetshop_staff without Secure in development), a CSRF token derived in its own namespace, and
    STAFF_TRUSTED_ORIGINS, which must not overlap the customer TRUSTED_ORIGINS. The routes exist only when
    STAFF_TRUSTED_ORIGINS is configured with PostgreSQL storage; otherwise every /api/admin path is 404, as it
    is at the customer edge in every configuration. Customer cookies and any Authorization header never
    authenticate staff. Responses use no-store. Bodies follow the customer JSON rules (one JSON value, no
    unknown members, 1048576-byte cap, 422 for malformed input). Besides the staff session it covers product
    management (ADR 013): every product route requires the staff cookie (401 otherwise, including any
    Authorization header or a customer session), and unsafe methods also require an Origin in
    STAFF_TRUSTED_ORIGINS and the staff X-CSRF-Token (403 csrf_failed). X-Expected-Staff-ID, when sent, must
    name the authenticated staff member (409 authenticated_staff_changed). Each successful product mutation
    commits together with one staff audit event whose actor is the session's staff member (ADR 012); rejected
    requests write nothing. Products are archived and restored, never deleted. Orders (ADR 016) are never
    deleted either: staff move them through processing, transit and delivered, or cancel them while processing,
    which returns their stock in the same audited transaction.
servers:
- url: /
paths:
  /api/admin/v1/auth/session:
    get:
      operationId: staffSessionState
      summary: staffSessionState
      description: >-
        Reports the staff cookie session only. A missing, invalid, expired or disabled-account session returns
        authenticated=false (an invalid cookie is cleared). Any Authorization header is 401.
      security: []
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Authenticated-Staff-ID:
              description: Present when authenticated.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSessionState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: startStaffSession
      summary: startStaffSession
      description: >-
        Staff login. Requires an Origin in STAFF_TRUSTED_ORIGINS (403 csrf_failed otherwise; customer origins
        are never staff origins). Unknown email, wrong password and a disabled account all return the same 401.
        Always mints a new random session; a presented staff cookie is revoked atomically with creating it.
        The token is only in the Set-Cookie header, never in the body. Any Authorization header is 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginInput'
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: The staff session cookie; HttpOnly, SameSite=Strict, Path=/, no Domain, Max-Age up to 12 hours.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: service_unavailable; too many password checks are running in this process (the bound is
            shared with customer sign-in and registration). Nothing changed; retry after Retry-After seconds.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: endStaffSession
      summary: endStaffSession
      description: >-
        Revokes the presented staff session. With a staff cookie, requires an Origin in STAFF_TRUSTED_ORIGINS
        and the staff X-CSRF-Token (a customer CSRF token never validates). X-Expected-Staff-ID opts into
        authentication and owner binding (409 authenticated_staff_changed when it names another staff member,
        401 when the session is not valid); without it a stale or missing session is still a 204. Always clears
        the staff cookie on 204. Any Authorization header is 401.
      security: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          type: string
      - name: X-Expected-Staff-ID
        in: header
        required: false
        schema:
          type: string
      responses:
        '204':
          description: Signed out.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '409':
          description: authenticated_staff_changed; X-Expected-Staff-ID names a different staff member.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/v1/products:
    get:
      operationId: listProducts
      summary: listProducts
      description: >-
        Staff product list ordered by name, then ID. status is active (default), archived or all. q (up to 100
        characters, one line) matches the ID or SKU exactly, or a case-insensitive substring of the name, slug or
        SKU. page starts at 1 (at most 10000); limit is 1-100, default 50. Archived products are included only
        when requested.
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - archived
          - all
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10000
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProductPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/StaffChanged'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createProduct
      summary: createProduct
      description: >-
        Creates an active product with a new ID (prd_ + 32 hex digits) at revision 1, without images, and appends
        it to the end of each listed collection. Every member is required. References must exist and the brand
        must belong to the manufacturer. The slug must not equal any other product's slug, ID or SKU
        (case-insensitive), and the SKU must not equal any other product's SKU, slug or ID (case-insensitive),
        because customer product lookups accept any of them. Audited as product.create.
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      - $ref: '#/components/parameters/ExpectedStaffID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Created
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '409':
          $ref: '#/components/responses/StaffChanged'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/v1/products/{product}:
    parameters:
    - $ref: '#/components/parameters/Product'
    get:
      operationId: getProduct
      summary: getProduct
      description: One product by ID, archived or not. Unknown IDs are 404.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaffChanged'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateProduct
      summary: updateProduct
      description: >-
        Replaces every staff-editable field (the same members as createProduct, all required) and the collection
        memberships; kept memberships keep their position. expectedRevision must be the product's current
        revision, otherwise 409 stale_revision and nothing changes. Success increments the revision by exactly
        one. Checkout stock decrements also increment the revision, so an edit based on an older stock value is
        refused. Archived products may be edited and stay archived. Image, gallery, rating, reviews, currency
        and archive state are not changed here. Audited as product.update.
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      - $ref: '#/components/parameters/ExpectedStaffID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateInput'
      responses:
        '200':
          description: Updated
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/v1/products/{product}/archive:
    parameters:
    - $ref: '#/components/parameters/Product'
    post:
      operationId: archiveProduct
      summary: archiveProduct
      description: >-
        Withdraws an active product from sale and increments its revision. Nothing is deleted. Customers no longer
        see it in the catalog, search, facets, collections, product detail (404) or favorites (kept, shown again
        after a restore); cart lines stay and are reported unavailable, checkout refuses them with out_of_stock,
        and repeat flows report it as discontinued. Order history is unchanged. Archiving an archived product is
        409 conflict. Audited as product.archive.
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      - $ref: '#/components/parameters/ExpectedStaffID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionInput'
      responses:
        '200':
          description: Archived
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/v1/products/{product}/restore:
    parameters:
    - $ref: '#/components/parameters/Product'
    post:
      operationId: restoreProduct
      summary: restoreProduct
      description: >-
        Returns an archived product to sale and increments its revision. Restoring an active product is 409
        conflict. Audited as product.restore.
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      - $ref: '#/components/parameters/ExpectedStaffID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionInput'
      responses:
        '200':
          description: Restored
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProduct'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/v1/catalog-options:
    get:
      operationId: getCatalogOptions
      summary: getCatalogOptions
      description: >-
        Read-only dictionaries for the staff product form, in storefront order: every category (with its
        parent), manufacturer, brand (with the manufacturer it belongs to) and collection, whether or not any
        product uses it. Requires the staff session like every product read. Product writes recheck every
        reference, so a stale list can only lead to a validation error.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogOptions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/StaffChanged'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/v1/orders:
    get:
      operationId: listOrders
      summary: listOrders
      description: >-
        Staff order list, newest first (then by ID). status filters one status (processing, transit,
        delivered or cancelled); omitted means all. q (up to 100 characters, one line) matches the order ID or
        number exactly ("10483" and "#10483" both match #10483) or a case-insensitive substring of the
        customer's email or name. page starts at 1 (at most 10000); limit is 1-100, default 50. List items carry
        no lines.
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/OrderStatus'
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10000
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/StaffChanged'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/v1/orders/{order}:
    parameters:
    - $ref: '#/components/parameters/Order'
    get:
      operationId: getOrder
      summary: getOrder
      description: >-
        One order with its lines. Lines, prices, totals, delivery address and comment are the snapshot checkout
        stored and never change; customer is the account as it is now (orders store no contact snapshot).
        allowedTransitions lists the statuses staff may move the order to; empty means no further change.
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/StaffChanged'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/v1/orders/{order}/status:
    parameters:
    - $ref: '#/components/parameters/Order'
    post:
      operationId: changeOrderStatus
      summary: changeOrderStatus
      description: >-
        Moves an order forward: processing to transit, or transit to delivered (which also sets deliveredAt).
        status must be transit or delivered (422 otherwise; cancellation is cancelOrder). expectedRevision must be
        the current revision (409 stale_revision); a transition the current status does not allow is 409
        invalid_transition. Success increments the revision by one. Audited as order.status_change. No customer
        notification is sent.
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      - $ref: '#/components/parameters/ExpectedStaffID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusChangeInput'
      responses:
        '200':
          description: Changed
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrderConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/admin/v1/orders/{order}/cancel:
    parameters:
    - $ref: '#/components/parameters/Order'
    post:
      operationId: cancelOrder
      summary: cancelOrder
      description: >-
        Cancels an order that is still processing and, in the same transaction, returns every ordered quantity
        to its product's stock (archived products included; they stay archived; a product row that no longer
        exists gets nothing back). Each restocked product gets a new revision. An order reaches cancelled only
        from processing, so its stock returns at most once; cancelling again is 409 invalid_transition, a stale
        expectedRevision is 409 stale_revision. Audited as order.cancel. Nothing is refunded and no customer
        notification is sent.
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      - $ref: '#/components/parameters/ExpectedStaffID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionInput'
      responses:
        '200':
          description: Cancelled
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CSRFFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/OrderConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  headers:
    RequestID:
      description: Echoed X-Request-ID or server-generated identifier.
      schema:
        type: string
    NoStore:
      schema:
        type: string
        enum:
        - no-store
  parameters:
    Product:
      name: product
      in: path
      required: true
      description: Product ID (legacy IDs such as p01, or prd_ + 32 hex digits).
      schema:
        type: string
    Order:
      name: order
      in: path
      required: true
      description: Order ID (for example ord-2026-10483).
      schema:
        type: string
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: The staff CSRF token from the staff session.
      schema:
        type: string
    ExpectedStaffID:
      name: X-Expected-Staff-ID
      in: header
      required: false
      schema:
        type: string
  responses:
    Unauthorized:
      description: unauthorized; bad credentials, disabled account, invalid session or an Authorization header.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    CSRFFailed:
      description: csrf_failed; missing or non-staff Origin, or a missing/invalid staff CSRF token.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: validation_error; optional error.fields identifies invalid input.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: not_found; no product has this ID.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    StaffChanged:
      description: authenticated_staff_changed; X-Expected-Staff-ID names a different staff member.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RevisionConflict:
      description: >-
        stale_revision (expectedRevision is not the current revision; reload and reapply); conflict (archive of
        an archived product or restore of an active one); authenticated_staff_changed. Nothing changed and no
        audit event was written.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    OrderConflict:
      description: >-
        stale_revision (expectedRevision is not the current revision; reload); invalid_transition (the current
        status does not allow this change, for example a delivered or already cancelled order);
        authenticated_staff_changed. Nothing changed and no audit event was written.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: internal_error; unexpected storage or server failure.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    StaffLoginInput:
      type: object
      required:
      - email
      - password
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
    StaffUser:
      type: object
      required:
      - id
      - email
      - displayName
      - createdAt
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: '^stf_[0-9a-f]{32}$'
        email:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
    StaffSession:
      type: object
      required:
      - staff
      - expiresAt
      - csrfToken
      additionalProperties: false
      properties:
        staff:
          $ref: '#/components/schemas/StaffUser'
        expiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
          description: Send as X-CSRF-Token on unsafe staff requests; valid only in the staff namespace.
    StaffSessionState:
      type: object
      required:
      - authenticated
      additionalProperties: false
      properties:
        authenticated:
          type: boolean
        staff:
          $ref: '#/components/schemas/StaffUser'
        expiresAt:
          type: string
          format: date-time
        csrfToken:
          type: string
    ProductInput:
      type: object
      description: Every staff-editable product field; all members are required and none may be null.
      required:
      - slug
      - sku
      - name
      - shortName
      - description
      - priceMinor
      - oldPriceMinor
      - unit
      - weightGrams
      - categoryId
      - manufacturerId
      - brandId
      - collectionIds
      - series
      - tags
      - badges
