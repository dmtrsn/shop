    MediaUpload:
      type: object
      required:
      - file
      properties:
        file:
          type: string
          format: binary
          description: The image bytes. The part's file name and Content-Type are ignored.
    MediaAsset:
      type: object
      description: >-
        Staff view of a live managed asset. Every field is derived from the stored, normalized bytes; the
        original file name is not kept.
      required:
      - id
      - contentType
      - sizeBytes
      - width
      - height
      - sha256
      - createdAt
      - url
      - productCount
      additionalProperties: false
      properties:
        orderCount:
          type: integer
          minimum: 0
          description: Number of historical orders retaining this image.
        id:
          type: string
          pattern: '^med_[0-9a-f]{32}$'
        contentType:
          type: string
          enum:
          - image/jpeg
          - image/png
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Digest of the stored bytes; /media/{id} uses it as the ETag.
        createdAt:
          type: string
          format: date-time
        url:
          type: string
          description: Public delivery path, /media/{id}, served by the shop and admin hosts.
        thumbnailUrl:
          type: string
          pattern: '^/media/med_[0-9a-f]{32}/thumbnail/[0-9a-f]{64}$'
          description: Immutable URL of a smaller derived copy. Absent when the asset has none, so clients keep url
            as the fallback.
        productCount:
          type: integer
          minimum: 0
    MediaPage:
      type: object
      required:
      - items
      - total
      - page
      - limit
      - totalPages
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MediaAsset'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
    OrderStatus:
      type: string
      description: >-
        processing (checkout), transit, delivered, cancelled. Staff lifecycle: processing to transit or
        cancelled, transit to delivered; delivered and cancelled are terminal.
      enum:
      - processing
      - transit
      - delivered
      - cancelled
    OrderStatusChangeInput:
      type: object
      required:
      - status
      - expectedRevision
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - transit
          - delivered
        expectedRevision:
          type: integer
          format: int64
          minimum: 1
    OrderContact:
      type: object
      description: >-
        The customer's name, email and phone as they were when the order was placed, recorded by checkout and never
        changed afterwards (ADR 017). Absent on orders placed before they were recorded; such orders are never
        backfilled from the current account.
      required: [name, email, phone]
      additionalProperties: false
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          description: Empty when the customer gave none.
    AdminOrderLine:
      type: object
      required: [position, productId, sku, name, manufacturer, quantity, unitPriceMinor, lineTotalMinor]
      additionalProperties: false
      properties:
        position:
          type: integer
        productId:
          type: string
        sku:
          type: string
        name:
          type: string
        manufacturer:
          type: string
        quantity:
          type: integer
        unitPriceMinor:
          type: integer
          format: int64
        lineTotalMinor:
          type: integer
          format: int64
    AdminOrder:
      type: object
      description: Staff view of an order. items is present on getOrder and the mutations, absent in list items.
      required: [id, number, revision, status, statusLabel, allowedTransitions, createdAt, customerId, deliveryAddress, comment, itemCount, totalMinor]
      additionalProperties: false
      properties:
        id:
          type: string
        number:
          type: string
        revision:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          description: One of OrderStatus; an older status outside it is shown as stored and allows no transition.
        statusLabel:
          type: string
          description: The customer-facing label stored with the status.
        allowedTransitions:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatus'
        createdAt:
          type: string
          format: date-time
        deliveredAt:
          type: string
          format: date-time
        customerId:
          type: string
          description: The customer account the order belongs to.
        contact:
          $ref: '#/components/schemas/OrderContact'
        currentAccount:
          allOf:
          - $ref: '#/components/schemas/OrderContact'
          description: >-
            Only for orders without a recorded contact (placed before ADR 017, or by an older application
            version during a rolling deploy): the account's name, email and phone as they are NOW, which may differ
            from the order's time. Never the order's contact; absent whenever contact is present.
        deliveryAddress:
          type: string
        comment:
          type: string
        itemCount:
          type: integer
        totalMinor:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrderLine'
    AdminOrderPage:
      type: object
      required: [items, total, page, limit, totalPages]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrder'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
    Error:
      type: object
      required:
      - error
      additionalProperties: false
      properties:
        error:
          type: object
          required:
          - code
          - message
          - requestId
          additionalProperties: false
          properties:
            code:
              type: string
              enum:
              - validation_error
              - unauthorized
              - csrf_failed
              - authenticated_staff_changed
              - not_found
              - stale_revision
              - conflict
              - invalid_transition
              - invalid_hierarchy
              - reference_conflict
              - media_too_large
              - unsupported_media_type
              - storage_unavailable
              - service_unavailable
              - internal_error
            message:
              type: string
            requestId:
              type: string
            references:
              type: object
              description: Present on reference_conflict; what still uses the row or asset.
              required:
              - products
              - brands
              - categories
              additionalProperties: false
              properties:
                orders:
                  type: integer
                  minimum: 0
                  description: Historical orders retaining this image. No order details are exposed.
                products:
                  type: integer
                  minimum: 0
                brands:
                  type: integer
                  minimum: 0
                  description: Active brands of a manufacturer.
                categories:
                  type: integer
                  minimum: 0
                  description: Active subcategories of a category.
            fields:
              type: array
              items:
                type: object
                required:
                - field
                - message
                properties:
                  field:
                    type: string
                  message:
                    type: string
